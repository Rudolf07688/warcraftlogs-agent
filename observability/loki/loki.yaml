# Loki, single binary on local disk (feature 053). Receives OTLP from Alloy at /otlp.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01" # well before any data (a record before the start gets a retryable 503)
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true
  # Logs 30 days; the content stream (prompts, responses, tool content) 7 days (spec §10, §14 decision 7).
  retention_period: 720h
  retention_stream:
    - selector: '{content="true"}'
      priority: 1
      period: 168h
  # Index labels are the spec §9.2 allowlist plus the bounded content label; every other
  # resource attribute (service.instance.id among them) becomes structured metadata.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.namespace
            - service.name
            - deployment.environment.name
            - app.layer
            - content

analytics:
  reporting_enabled: false

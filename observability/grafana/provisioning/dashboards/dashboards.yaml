# Grafana dashboards as code (spec §8.2). JSON lives in observability/grafana/dashboards/,
# one folder per layer (build, runtime); the folder becomes the Grafana folder.
# Edits made in the UI are not saved back: change the JSON and restart Grafana.
apiVersion: 1

providers:
  - name: wcl-agent
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true

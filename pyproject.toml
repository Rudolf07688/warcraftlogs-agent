[project]
name = "wcl-agent-app"
version = "0.1.0"
description = "Interactive AI chat agent (Google ADK + Gemini) that pulls and analyzes Warcraft Logs ranking data, with a streaming web frontend."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk==2.10.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.4.0",
    "matplotlib>=3.11.2",
    "anthropic[vertex]>=1.11.0",
    "plotly>=7.1.0",
    "pwdlib[argon2]>=0.2.1",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "redis>=6",
    "weasyprint>=70.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "nh3>=0.3.7",
    "pgvector>=0.5.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "opentelemetry-instrumentation-redis==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    # Span profiles (feature 059, spec §6.7): off unless PYROSCOPE_SERVER_ADDRESS is set.
    "pyroscope-io==1.4.0",
    "pyroscope-otel==1.1.0",
    # observability/pricing/generate.py and its tests (sc-463); was only transitive.
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.22.1",
    "fakeredis>=2.30",
    "pypdf>=6.21.1",
]

[project.scripts]
wcl = "wcl_agent.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wcl_agent", "backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = ["perf: timing-sensitive benchmarks (run with -m perf)"]
addopts = "-m 'not perf'"

[project]
name = "wcl-agent-app"
version = "0.1.0"
description = "Interactive AI chat agent (Google ADK + Gemini) that pulls and analyzes Warcraft Logs ranking data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
]

[project.scripts]
wcl = "wcl_agent.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wcl_agent"]

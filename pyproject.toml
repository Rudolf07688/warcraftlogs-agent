[project]
name = "wcl-agent-app"
version = "0.1.0"
description = "Interactive AI chat agent (Google ADK + Gemini) that pulls and analyzes Warcraft Logs ranking data, with a streaming web frontend."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk>=2.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.4.0",
    "reportlab>=5.0.1",
    "matplotlib>=3.11.2",
    "markdown>=3.11",
    "anthropic[vertex]>=1.11.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.22.1",
]

[project.scripts]
wcl = "wcl_agent.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wcl_agent", "backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Alembic configuration for the WCL Agent backend (feature 006 multi-tenancy).
#
# Run from the `backend/` directory:   uv run alembic upgrade head
# The database URL is NOT set here — env.py reads the migration-OWNER URL from
# app settings (settings.owner_database_url) so credentials stay in one place and
# never land in version control.
[alembic]
# Resolve the versions tree relative to this ini file, so the command works from
# any CWD as long as -c points here.
script_location = %(here)s/migrations
prepend_sys_path = ..
# Use a timezone-aware, sortable prefix for any autogenerated revisions.
# (We hand-author the feature migrations; this only affects `alembic revision`.)
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

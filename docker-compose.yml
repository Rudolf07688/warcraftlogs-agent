# Local full-stack: db + backend (FastAPI) + frontend (Vite).
# Secrets/config come from the root .env (env_file). Bring up with:  docker compose up --build
services:
  db:
    image: postgres:17
    env_file: .env
    environment:
      # POSTGRES_USER is the owner/superuser — it owns the tables and runs Alembic
      # migrations (the migration-OWNER role). APP_DB_USER is the non-privileged
      # RUNTIME role the app connects as (created by postgres-init, no BYPASSRLS) so
      # row-level security constrains it (feature 006, research R4).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first DB init: creates the runtime role (see the script header).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Runtime connection uses the non-privileged APP_DB_USER (RLS applies).
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # Alembic connects as the owner (POSTGRES_USER) to ALTER tables + enable RLS.
      DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Vertex AI via the mounted Application Default Credentials (read-only).
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:

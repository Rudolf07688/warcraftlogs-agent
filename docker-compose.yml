# Local full-stack: db + redis (shared WCL cache) + backend (FastAPI) + frontend (Vite)
# + alloy (always-on telemetry collector, feature 053).
# Secrets/config come from the root .env (env_file). Bring up with:  docker compose up --build
# Telemetry backends and Grafana (observability/README.md):
#   docker compose --profile observability up -d
services:
  db:
    # Postgres 17 plus the pgvector extension (feature 043, knowledge base): same major
    # version and on-disk format as postgres:17, so an existing pgdata volume starts as is.
    # The trixie tag matches postgres:17's Debian 13 glibc (2.41); the plain pg17 tag is
    # bookworm (2.36) and would leave a collation-version mismatch on an existing database.
    image: pgvector/pgvector:pg17-trixie
    # Optional (feature 058): the test stacks start db without a .env; the variables below come
    # from the shell or .env either way.
    env_file:
      - path: .env
        required: false
    # Telemetry (feature 058, spec §7.2): statement statistics, and slow statements (over 250 ms),
    # lock waits and autovacuum runs on stderr, which Alloy reads through Docker's log. Bind
    # parameter values are never logged (log_parameter_max_length=0); Alloy masks the literals
    # left in the text. The prefix is what Alloy parses: time, pid, query id (pg_stat_statements'
    # queryid), SQLSTATE. Utility statements are not tracked: their text is not normalized (an
    # ALTER ROLE ... PASSWORD would be kept verbatim). Nothing here changes the data volume.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - log_min_duration_statement=250ms
      - -c
      - log_lock_waits=on
      - -c
      - log_autovacuum_min_duration=0
      - -c
      - log_parameter_max_length=0
      - -c
      - "log_line_prefix=%m [%p] q=%Q %e "
    environment:
      # POSTGRES_USER is the owner/superuser — it owns the tables and runs Alembic
      # migrations. The non-privileged RUNTIME role (APP_DB_USER) that the app connects
      # as is created by migration 0004_rls (from APP_DB_USER/APP_DB_PASSWORD), so there
      # is no mounted init script (those are fragile to exec across platforms).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only (QA SEC-001): local tools (alembic, psql, `uv run` dev) reach it on
    # localhost; the backend container uses the compose network, never the host port.
    ports:
      # DB_PORT / REDIS_PORT: the test stacks (observability/test) move them off the app's ports.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    # Disposable WCL cache (feature 014): bounded memory, LRU eviction, no persistence —
    # recreating the container just empties the cache.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    # Loopback only (QA SEC-001): this Redis has no auth, so it must not face the LAN.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Runtime connection uses the non-privileged APP_DB_USER (RLS applies).
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # Alembic connects as the owner (POSTGRES_USER) to ALTER tables + enable RLS.
      DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Vertex AI via the mounted Application Default Credentials (read-only).
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
      # Shared WCL cache (feature 014); overrides the host-side REDIS_URL from .env.
      REDIS_URL: redis://redis:6379/0
      # Telemetry (feature 054 contract:env): export to Alloy over OTLP http/protobuf. The
      # backend starts with Alloy down, so there is deliberately no depends_on on alloy.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      WCL_ENVIRONMENT: dev
      WCL_GIT_SHA: ${WCL_GIT_SHA:-unknown}
      # Span profiles (feature 059): CPU profiles of root spans pushed to Pyroscope. Like
      # Alloy it may be down (observability profile off): the profiles are dropped then.
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
    volumes:
      # Defaults to the Linux/macOS gcloud location. On Windows set GCP_ADC_FILE in .env,
      # e.g. C:/Users/<you>/AppData/Roaming/gcloud/application_default_credentials.json
      - ${GCP_ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/gcp/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Local development: Vite dev server with hot reload. For a production-like build,
      # use `target: prod` (nginx on port 80) — see README.
      target: dev
    environment:
      VITE_BACKEND_URL: http://backend:8000
      # Browser telemetry (feature 057): Faro posts to Alloy's receiver on the host's loopback
      # port. Set VITE_FARO_URL empty to switch it off. The key is public (it ships in the
      # bundle); it must match the receiver's api_key in observability/alloy/config.alloy.
      VITE_FARO_URL: ${VITE_FARO_URL-http://localhost:12347/collect}
      VITE_FARO_API_KEY: ${VITE_FARO_API_KEY:-wcl-faro-local}
      VITE_FARO_APP_VERSION: ${WCL_GIT_SHA:-unknown}
      VITE_FARO_ENVIRONMENT: dev
    depends_on:
      - backend
    ports:
      - "5173:5173"

  # Telemetry collector (feature 053): always on, receives OTLP from the backend and from
  # Claude Code (bin/claude-otel), redacts, and queues on disk while the backends are absent.
  # --stability.level=public-preview is needed for the file-backed export queue.
  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview
      - /etc/alloy/config.alloy
    volumes:
      # ALLOY_CONFIG_DIR: the test scripts mount a copy here (mutation.sh edits only that).
      - ${ALLOY_CONFIG_DIR:-./observability/alloy}:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      # The team board (feature 055): board.py keeps it in the git common dir. In a worktree
      # ./.git is a file, so set TEAM_BOARD_DIR to "$(git rev-parse --git-common-dir)/team-board".
      - ${TEAM_BOARD_DIR:-./.git/team-board}:/var/lib/team-board:ro
      # The Postgres exporter's custom queries (feature 058).
      - ./observability/postgres:/etc/alloy-postgres:ro
    environment:
      # Feature 058: the Postgres exporter logs in as the monitoring role (migration 0022, member
      # of pg_monitor only), never as the owner. Alloy shows the value as a secret; set
      # PG_MONITOR_PASSWORD in .env (letters and digits: it goes into a URL).
      WCL_PG_MONITOR_DSN: postgresql://${PG_MONITOR_USER:-wcl_monitor}:${PG_MONITOR_PASSWORD:-}@db:5432/${POSTGRES_DB:-}?sslmode=disable
      # Docker logs and container metrics are read for this compose project only (the test stacks
      # share the Docker daemon with the app's).
      WCL_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    networks: [default, docker-api]
    ports:
      - "127.0.0.1:${ALLOY_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${ALLOY_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${ALLOY_UI_PORT:-12345}:12345"
      - "127.0.0.1:${ALLOY_FARO_PORT:-12347}:12347" # Faro receiver (feature 057)
    mem_limit: 512m
    restart: unless-stopped

  # Feature 058: read-only Docker API for Alloy (Postgres's container log, container discovery) and
  # cAdvisor (container names). Alloy never mounts the socket: it parses browser payloads (Faro),
  # and a socket gives the whole Docker API whatever the mount flag (":ro" does not restrict API
  # calls). The proxy answers GET on containers, networks (discovery reads them), info, version
  # and events only (POST=0), on the
  # internal docker-api network (no host port). Residual: a container's inspect output (its env)
  # is readable by Alloy and cAdvisor.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    mem_limit: 64m
    restart: unless-stopped

  # Container CPU and memory per compose service (feature 058, D11), scraped by Alloy. A service
  # of its own, not Alloy's built-in exporter: with Docker's containerd image store cAdvisor needs
  # the containerd socket to name containers, and that socket (root-equivalent) stays out of the
  # collector that takes browser input. Not privileged; host paths read-only; no host port.
  # Linux Docker hosts only (Docker Desktop hides the host's cgroups).
  cadvisor:
    image: ghcr.io/google/cadvisor:0.54.1
    profiles: [observability]
    command:
      - --docker=tcp://docker-proxy:2375
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --enable_metrics=cpu,memory
      - --housekeeping_interval=30s
    volumes:
      - /sys:/sys:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    networks: [docker-api]
    mem_limit: 256m
    restart: unless-stopped

  # --- observability profile: storage backends and Grafana (feature 053) ---
  loki:
    image: grafana/loki:3.7.9
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.10
    profiles: [observability]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m
    restart: unless-stopped

  mimir:
    image: grafana/mimir:3.2.4
    profiles: [observability]
    command: ["-config.file=/etc/mimir/mimir.yaml", "-target=all"]
    volumes:
      - ./observability/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      # MIMIR_RULES_DIR: the test scripts mount a copy here (rules.sh changes a price only there).
      - ${MIMIR_RULES_DIR:-./observability/mimir/rules}:/etc/mimir/rules:ro
      - mimir-data:/data
    mem_limit: 1g
    restart: unless-stopped

  # Grafana holds no telemetry: datasources are provisioned from the repository. Anonymous
  # visitors are Viewers who can use Explore; the admin login uses GRAFANA_ADMIN_PASSWORD
  # (unset = no admin login, see observability/grafana/entrypoint.sh). Port on loopback only.
  grafana:
    image: grafana/grafana:13.2.5
    profiles: [observability]
    entrypoint: ["/etc/grafana/entrypoint.sh"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
      - tempo
      - mimir
    mem_limit: 512m
    restart: unless-stopped

  # Span profiles (feature 059, spec §6.7): single binary on local disk (everything under
  # /data), 7 days like the traces they link to. Grafana's Tempo "Profiles for this span"
  # opens them. Port on loopback only, for a backend run on the host.
  pyroscope:
    image: grafana/pyroscope:2.4.3
    profiles: [observability]
    command:
      - -config.file=/etc/pyroscope/config.yaml
      - -retention-period=168h
      - -architecture.storage=v2  # new install: no v1 data to read
      - -self-profiling.disable-push=true
      - -usage-stats.enabled=false
      # One instance: no rolling-update waits before it reports ready.
      - -metastore.min-ready-duration=0
      - -ingester.min-ready-duration=0
      - -segment-writer.min-ready-duration=0
    volumes:
      - pyroscope-data:/data
    ports:
      - "127.0.0.1:${PYROSCOPE_PORT:-4040}:4040"
    mem_limit: 512m
    restart: unless-stopped

networks:
  # Internal only (feature 058): the Docker API proxy, Alloy and cAdvisor.
  docker-api:
    internal: true

volumes:
  pgdata:
  alloy-data:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
  pyroscope-data:
